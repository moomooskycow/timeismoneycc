name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Define permissions needed by this workflow
permissions:
  contents: read
  # Required for actions/upload-artifact
  actions: read
  # For commenting on PRs if needed in the future
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, hetzner-ci, timeismoneycc-ci]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Latest LTS version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npm run lint

    - name: Run CSS Linting
      run: npm run lint:css

    - name: Check Formatting
      run: npm run format:check

    - name: Validate HTML
      run: |
        echo "Validating HTML in index.html file only"
        npx html-validate index.html || echo "HTML validation issues found, but continuing build"

  typecheck:
    name: TypeScript Check
    runs-on: [self-hosted, hetzner-ci, timeismoneycc-ci]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Latest LTS version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Run TypeScript Type Checking
      run: npm run typecheck

  test:
    name: Test
    runs-on: [self-hosted, hetzner-ci, timeismoneycc-ci]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Latest LTS version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Run tests with coverage enforcement
      run: npm test -- --coverage

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
        retention-days: 14

  security:
    name: Security Scan
    runs-on: [self-hosted, hetzner-ci, timeismoneycc-ci]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Latest LTS version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Run security scan for high and critical vulnerabilities
      run: npm audit --audit-level=high || echo "Security vulnerabilities found, but continuing build"
